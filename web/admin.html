<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - LINE Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background: #f4f7ff; min-height:100vh; }
      .container { max-width: 980px; }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin - จัดการข้อมูล</h2>
        <a href="/" class="btn btn-outline-secondary">กลับสู่แดชบอร์ด</a>
      </div>

      <div class="row g-4">
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Memories</h5>
            <div class="mb-2">
              <textarea id="memoryText" class="form-control" rows="3" placeholder="ข้อความที่จะบันทึก"></textarea>
            </div>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-primary" id="saveMemoryBtn">บันทึก</button>
              <button class="btn btn-outline-secondary" id="loadMemoriesBtn">โหลดรายการ</button>
              <button class="btn btn-danger" id="deleteAllMemoriesBtn">ลบทั้งหมด</button>
            </div>
            <ul id="memoriesList" class="list-group list-group-flush" style="max-height:300px; overflow:auto;"></ul>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3">
            <h5>Work Schedule</h5>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <input id="workDate" class="form-control" type="date" />
              </div>
              <div class="col-6">
                <input id="workShift" class="form-control" type="text" placeholder="เช่น เช้า, บ่าย" />
              </div>
            </div>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-primary" id="saveScheduleBtn">เพิ่ม/แก้ไข</button>
              <button class="btn btn-outline-secondary" id="loadScheduleBtn">โหลดเดือนนี้</button>
            </div>
            <table class="table table-sm">
              <thead>
                <tr><th>วันที่</th><th>เวร</th><th></th></tr>
              </thead>
              <tbody id="scheduleTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>

    <script>
      async function api(path, opts = {}) {
        const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
        if (!res.ok) throw new Error(await res.text());
        return res.json().catch(() => null);
      }

      document.getElementById('saveMemoryBtn').addEventListener('click', async () => {
        const text = document.getElementById('memoryText').value.trim();
        if (!text) return alert('กรุณากรอกข้อความ');
        try {
          await api('/api/admin/memories', { method: 'POST', body: JSON.stringify({ content: text }) });
          alert('บันทึกเรียบร้อย');
          document.getElementById('memoryText').value = '';
          loadMemories();
        } catch (err) { alert(err.message); }
      });

      async function loadMemories() {
        try {
          const mem = await api('/api/admin/memories');
          const list = document.getElementById('memoriesList');
          list.innerHTML = mem.length === 0 ? '<li class="list-group-item text-muted">ยังไม่มี</li>' : mem.map(m => `<li class="list-group-item d-flex justify-content-between align-items-start"><div><div class="fw-semibold">${new Date(m.created_at).toLocaleString()}</div><div class="small text-muted">${m.content}</div></div><button class="btn btn-sm btn-outline-danger" data-id="${m.id}">ลบ</button></li>`).join('');
          list.querySelectorAll('button[data-id]').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = btn.getAttribute('data-id');
            const keyword = prompt('ลบโดยคำค้น (ใส่คำที่ต้องการลบ) หรือยกเลิกเพื่อไม่ลบ');
            if (!keyword) return;
            try {
              await api(`/api/admin/memories?keyword=${encodeURIComponent(keyword)}`, { method: 'DELETE' });
              loadMemories();
            } catch (err) { alert(err.message); }
          }));
        } catch (err) { alert('โหลดไม่สำเร็จ: ' + err.message); }
      }

      document.getElementById('loadMemoriesBtn').addEventListener('click', loadMemories);
      document.getElementById('deleteAllMemoriesBtn').addEventListener('click', async () => {
        if (!confirm('ยืนยันลบ memories ทั้งหมด?')) return;
        try { await api('/api/admin/memories', { method: 'DELETE' }); loadMemories(); alert('ลบเรียบร้อย'); } catch (err) { alert(err.message); }
      });

      // Schedule
      document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
        const date = document.getElementById('workDate').value;
        const shift = document.getElementById('workShift').value.trim();
        if (!date || !shift) return alert('กรุณากรอกวันที่และเวร');
        try {
          await api('/api/admin/schedule', { method: 'POST', body: JSON.stringify({ work_date: date, shift }) });
          alert('บันทึกเรียบร้อย');
          loadSchedule();
        } catch (err) { alert(err.message); }
      });

      async function loadSchedule(year, month) {
        try {
          const now = new Date();
          const y = year || now.getFullYear();
          const m = month || (now.getMonth() + 1);
          const rows = await api(`/api/admin/schedule?year=${y}&month=${m}`);
          const tbody = document.getElementById('scheduleTable');
          tbody.innerHTML = rows.length === 0 ? '<tr><td colspan="3" class="text-muted">ยังไม่มี</td></tr>' : rows.map(r => `<tr><td class="text-muted">${r.work_date}</td><td>${r.shift}</td><td><button class="btn btn-sm btn-danger" data-date="${r.work_date}">ลบ</button></td></tr>`).join('');
          tbody.querySelectorAll('button[data-date]').forEach(b => b.addEventListener('click', async (e) => {
            const d = b.getAttribute('data-date');
            if (!confirm('ยืนยันลบ ' + d + '?')) return;
            try { await api(`/api/admin/schedule?date=${encodeURIComponent(d)}`, { method: 'DELETE' }); loadSchedule(); } catch (err) { alert(err.message); }
          }));
        } catch (err) { alert('โหลดไม่สำเร็จ: ' + err.message); }
      }

      document.getElementById('loadScheduleBtn').addEventListener('click', () => loadSchedule());

      // initial
      loadMemories();
      loadSchedule();
    </script>
  </body>
</html>
