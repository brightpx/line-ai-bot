<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - LINE Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      :root {
        --surface-1: #0A0D12;
        --surface-2: #0F131C;
        --surface-3: #161D2B;
        --surface-4: #1E2636;
        --surface-5: #2A3447;
        --accent: #38BDF8;
        --accent-muted: #0EA5E9;
        --text-primary: #F1F5F9;
        --text-secondary: #94A3B8;
        --text-muted: #64748B;
        --border: rgba(148, 163, 184, 0.12);
        --radius-sm: 0.75rem;
        --radius-md: 1rem;
        --radius-lg: 1.5rem;
        --radius-pill: 999px;
        color-scheme: dark;
      }

      body {
        background: var(--surface-1);
        color: var(--text-primary);
        min-height: 100vh;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }

      .container {
        max-width: 980px;
      }

      .card {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      h2, h5 {
        color: var(--text-primary);
        font-weight: 700;
      }

      .btn {
        border-radius: var(--radius-pill);
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-muted));
        border: none;
        color: #fff;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(56, 189, 248, 0.4);
      }

      .btn-outline-primary {
        border: 1px solid var(--accent);
        color: var(--accent);
        background: transparent;
      }

      .btn-outline-primary:hover {
        background: var(--accent);
        color: #fff;
      }

      .btn-outline-secondary {
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: transparent;
      }

      .btn-outline-secondary:hover {
        background: var(--surface-3);
        border-color: var(--text-secondary);
      }

      .btn-outline-danger {
        border: 1px solid #EF4444;
        color: #EF4444;
        background: transparent;
      }

      .btn-outline-danger:hover {
        background: #EF4444;
        color: #fff;
      }

      .btn-danger {
        background: linear-gradient(135deg, #EF4444, #DC2626);
        border: none;
        color: #fff;
      }

      .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(239, 68, 68, 0.4);
      }

      .form-control, .form-control:focus {
        background: var(--surface-3);
        border: 1px solid var(--border);
        color: var(--text-primary);
        border-radius: var(--radius-sm);
      }

      .form-control:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
      }

      .table {
        color: var(--text-primary);
      }

      .table thead {
        background: var(--surface-3);
        border-bottom: 1px solid var(--border);
      }

      .table tbody tr {
        border-bottom: 1px solid var(--border);
        transition: background 0.2s ease;
      }

      .table tbody tr:hover {
        background: var(--surface-3);
      }

      .list-group-item {
        background: var(--surface-3);
        border: 1px solid var(--border);
        color: var(--text-primary);
        transition: all 0.2s ease;
      }

      .list-group-item:hover {
        background: var(--surface-4);
      }

      .text-muted {
        color: var(--text-muted) !important;
      }

      .small {
        color: var(--text-secondary);
      }

      .fw-semibold {
        font-weight: 600;
      }

      .btn-group {
        border-radius: var(--radius-pill);
        overflow: hidden;
      }

      .table-sm {
        font-size: 0.9rem;
        background: var(--surface-3);
      }

      .table-sm thead th {
        padding: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        background: var(--surface-4);
        border-color: var(--border);
      }

      .table-sm tbody td {
        padding: 0.75rem;
        vertical-align: middle;
        background: var(--surface-3);
        border-color: var(--border);
      }

      .table-sm tbody tr:hover td {
        background: var(--surface-4);
      }

      textarea.form-control {
        resize: vertical;
        min-height: 80px;
      }

      input[type="date"].form-control::-webkit-calendar-picker-indicator {
        filter: invert(0.8);
        cursor: pointer;
      }

      .btn-sm {
        font-size: 0.85rem;
        padding: 0.35rem 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Admin - จัดการข้อมูล</h2>
        <a href="/" class="btn btn-outline-secondary">กลับสู่แดชบอร์ด</a>
      </div>

      <div class="row g-4">
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Memories</h5>
            <div class="mb-2">
              <textarea id="memoryText" class="form-control" rows="3" placeholder="ข้อความที่จะบันทึก"></textarea>
            </div>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-primary" id="saveMemoryBtn">บันทึก</button>
              <button class="btn btn-outline-secondary" id="loadMemoriesBtn">โหลดรายการ</button>
              <button class="btn btn-danger" id="deleteAllMemoriesBtn">ลบทั้งหมด</button>
            </div>
            <ul id="memoriesList" class="list-group list-group-flush" style="max-height:300px; overflow:auto;"></ul>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <div>
                <button class="btn btn-sm btn-outline-secondary" id="memPrevBtn">‹ ก่อนหน้า</button>
                <button class="btn btn-sm btn-outline-secondary" id="memNextBtn">ถัดไป ›</button>
              </div>
              <div class="text-muted small">หน้า <span id="memPageLabel">1</span></div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card p-3">
            <h5>Work Schedule</h5>
            <div class="row g-2 mb-2">
              <div class="col-6">
                <input id="workDate" class="form-control" type="date" />
              </div>
              <div class="col-6">
                <input id="workShift" class="form-control" type="text" placeholder="เช่น เช้า, บ่าย" />
              </div>
            </div>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-primary" id="saveScheduleBtn">เพิ่ม/แก้ไข</button>
              <button class="btn btn-outline-secondary" id="loadScheduleBtn">โหลดเดือนนี้</button>
            </div>
            <table class="table table-sm">
              <thead>
                <tr><th>วันที่</th><th>เวร</th><th></th></tr>
              </thead>
              <tbody id="scheduleTable"></tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <div>
                <button class="btn btn-sm btn-outline-secondary" id="schedPrevBtn">‹ ก่อนหน้า</button>
                <button class="btn btn-sm btn-outline-secondary" id="schedNextBtn">ถัดไป ›</button>
              </div>
              <div class="text-muted small">หน้า <span id="schedPageLabel">1</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-4 mt-3">
        <div class="col-12">
          <div class="card p-3">
            <h5>วันหยุดพี่เลี้ยง</h5>
            <div class="row g-2 mb-2">
              <div class="col-md-4">
                <input id="caregiverHolidayDate" class="form-control" type="date" />
              </div>
              <div class="col-md-8">
                <input id="caregiverHolidayDescription" class="form-control" type="text" placeholder="คำอธิบายวันหยุด เช่น วันหยุดครอบครัว" />
              </div>
            </div>
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-primary" id="saveCaregiverHolidayBtn">บันทึก/แก้ไข</button>
              <button class="btn btn-outline-secondary" id="loadCaregiverHolidaysBtn">โหลดรายการ</button>
            </div>
            <table class="table table-sm">
              <thead>
                <tr><th>วันที่</th><th>คำอธิบาย</th><th></th></tr>
              </thead>
              <tbody id="caregiverHolidayTable"></tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center mt-2">
              <div>
                <button class="btn btn-sm btn-outline-secondary" id="caregiverPrevBtn">‹ ก่อนหน้า</button>
                <button class="btn btn-sm btn-outline-secondary" id="caregiverNextBtn">ถัดไป ›</button>
              </div>
              <div class="text-muted small">หน้า <span id="caregiverPageLabel">1</span></div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <script>
      async function api(path, opts = {}) {
        const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
        if (!res.ok) throw new Error(await res.text());
        return res.json().catch(() => null);
      }

      let memPage = 1;
      const memPageSize = 20;

      document.getElementById('saveMemoryBtn').addEventListener('click', async () => {
        const text = document.getElementById('memoryText').value.trim();
        if (!text) return alert('กรุณากรอกข้อความ');
        try {
          await api('/api/admin/memories', { method: 'POST', body: JSON.stringify({ content: text }) });
          alert('บันทึกเรียบร้อย');
          document.getElementById('memoryText').value = '';
          loadMemories(memPage);
        } catch (err) { alert(err.message); }
      });
      async function loadMemories(page = 1) {
        try {
          memPage = Math.max(1, Number(page) || 1);
          const resp = await api(`/api/admin/memories?page=${memPage}&pageSize=${memPageSize}`);
          const list = document.getElementById('memoriesList');
          const rows = resp.rows || [];
          const total = resp.total || 0;
          const totalPages = Math.max(1, Math.ceil(total / memPageSize));
          document.getElementById('memPageLabel').textContent = `${memPage} / ${totalPages}`;

          list.innerHTML = rows.length === 0 ? '<li class="list-group-item text-muted">ยังไม่มี</li>' : rows.map(m => `<li class="list-group-item d-flex justify-content-between align-items-start"><div><div class="fw-semibold">${new Date(m.created_at).toLocaleString()}</div><div class="small text-muted" data-id-content="${m.id}">${m.content}</div></div><div class="btn-group btn-group-sm" role="group"><button class="btn btn-outline-primary" data-edit-id="${m.id}">แก้ไข</button><button class="btn btn-outline-danger" data-del-id="${m.id}">ลบ</button></div></li>`).join('');

          // attach edit/delete handlers
          list.querySelectorAll('button[data-edit-id]').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = Number(btn.getAttribute('data-edit-id'));
            const contentEl = list.querySelector(`[data-id-content="${id}"]`);
            const current = contentEl ? contentEl.textContent : '';
            const nv = prompt('แก้ไขข้อความ', current);
            if (nv === null) return;
            try { await api(`/api/admin/memories/${id}`, { method: 'PUT', body: JSON.stringify({ content: nv }) }); loadMemories(memPage); } catch (err) { alert(err.message); }
          }));

          list.querySelectorAll('button[data-del-id]').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = Number(btn.getAttribute('data-del-id'));
            if (!confirm('ยืนยันลบ id=' + id + '?')) return;
            try { await api(`/api/admin/memories/${id}`, { method: 'DELETE' }); loadMemories(memPage); } catch (err) { alert(err.message); }
          }));

          // prev/next
          document.getElementById('memPrevBtn').onclick = () => { if (memPage > 1) loadMemories(memPage - 1); };
          document.getElementById('memNextBtn').onclick = () => { if (memPage < totalPages) loadMemories(memPage + 1); };
        } catch (err) { alert('โหลดไม่สำเร็จ: ' + err.message); }
      }

      document.getElementById('loadMemoriesBtn').addEventListener('click', () => loadMemories(1));
      document.getElementById('deleteAllMemoriesBtn').addEventListener('click', async () => {
        if (!confirm('ยืนยันลบ memories ทั้งหมด?')) return;
        try { await api('/api/admin/memories', { method: 'DELETE' }); loadMemories(1); alert('ลบเรียบร้อย'); } catch (err) { alert(err.message); }
      });

      // Work schedule pagination
      let schedPage = 1;
      const schedPageSize = 20;

      // Caregiver holidays
      let caregiverPage = 1;
      const caregiverPageSize = 20;

      document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
        const date = document.getElementById('workDate').value;
        const shift = document.getElementById('workShift').value.trim();
        if (!date || !shift) return alert('กรุณากรอกวันที่และเวร');
        try {
          await api('/api/admin/schedule', { method: 'POST', body: JSON.stringify({ work_date: date, shift }) });
          alert('บันทึกเรียบร้อย');
          loadSchedule(schedPage);
        } catch (err) { alert(err.message); }
      });

      async function loadSchedule(page = 1, year, month) {
        try {
          schedPage = Math.max(1, Number(page) || 1);
          let url;
          if (year && month) {
            url = `/api/admin/schedule?year=${year}&month=${month}`;
          } else {
            url = `/api/admin/schedule?page=${schedPage}&pageSize=${schedPageSize}`;
          }
          const resp = await api(url);
          const rows = resp.rows || resp || [];
          const total = resp.total || (Array.isArray(resp) ? resp.length : 0);
          const totalPages = Math.max(1, Math.ceil(total / schedPageSize));

          const tbody = document.getElementById('scheduleTable');
          if (!rows || rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-muted">ยังไม่มี</td></tr>';
          } else {
            const rowsHtml = rows.map(r => {
              // normalize date to YYYY-MM-DD for input[type=date]
              let d = r.work_date;
              try {
                if (typeof d === 'object' && d !== null && d.toISOString) d = d.toISOString();
                if (typeof d === 'string') d = d.slice(0, 10);
              } catch (e) { d = String(r.work_date).slice(0, 10); }
              const dateStr = d;
              return `<tr><td class="text-muted">${dateStr}</td><td>${r.shift}</td><td class="text-end"><div class="btn-group btn-group-sm" role="group"><button class="btn btn-outline-primary" data-edit-date="${dateStr}" data-edit-shift="${r.shift}">แก้ไข</button><button class="btn btn-outline-danger" data-date="${dateStr}">ลบ</button></div></td></tr>`;
            }).join('');
            tbody.innerHTML = rowsHtml;
          }

          document.getElementById('schedPageLabel').textContent = `${schedPage} / ${totalPages}`;

          tbody.querySelectorAll('button[data-date]').forEach(b => b.addEventListener('click', async (e) => {
            const d = b.getAttribute('data-date');
            if (!confirm('ยืนยันลบ ' + d + '?')) return;
            try { await api(`/api/admin/schedule?date=${encodeURIComponent(d)}`, { method: 'DELETE' }); loadSchedule(schedPage); } catch (err) { alert(err.message); }
          }));

          tbody.querySelectorAll('button[data-edit-date]').forEach(b => b.addEventListener('click', (e) => {
            const d = b.getAttribute('data-edit-date');
            const s = b.getAttribute('data-edit-shift');
            document.getElementById('workDate').value = d;
            document.getElementById('workShift').value = s;
          }));

          document.getElementById('schedPrevBtn').onclick = () => { if (schedPage > 1) loadSchedule(schedPage - 1); };
          document.getElementById('schedNextBtn').onclick = () => { if (schedPage < totalPages) loadSchedule(schedPage + 1); };
        } catch (err) { alert('โหลดไม่สำเร็จ: ' + err.message); }
      }

      document.getElementById('loadScheduleBtn').addEventListener('click', () => {
        const now = new Date(); loadSchedule(1, now.getFullYear(), now.getMonth() + 1);
      });

      async function loadCaregiverHolidays(page = 1) {
        try {
          caregiverPage = Math.max(1, Number(page) || 1);
          const resp = await api(`/api/admin/caregiver-holidays?page=${caregiverPage}&pageSize=${caregiverPageSize}`);
          const rows = resp.rows || [];
          const total = resp.total || 0;
          const totalPages = Math.max(1, Math.ceil(total / caregiverPageSize));
          document.getElementById('caregiverPageLabel').textContent = `${caregiverPage} / ${totalPages}`;

          const tbody = document.getElementById('caregiverHolidayTable');
          if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-muted">ยังไม่มี</td></tr>';
          } else {
            tbody.innerHTML = rows.map(r => {
              const dateStr = new Date(r.holiday_date).toISOString().slice(0, 10);
              return `<tr><td class="text-muted">${dateStr}</td><td>${r.description}</td><td class="text-end"><div class="btn-group btn-group-sm" role="group"><button class="btn btn-outline-primary" data-edit-date="${dateStr}" data-edit-description="${encodeURIComponent(r.description)}">แก้ไข</button><button class="btn btn-outline-danger" data-date="${dateStr}">ลบ</button></div></td></tr>`;
            }).join('');
          }

          tbody.querySelectorAll('button[data-edit-date]').forEach(btn => btn.addEventListener('click', () => {
            const date = btn.getAttribute('data-edit-date');
            const description = decodeURIComponent(btn.getAttribute('data-edit-description') || '');
            document.getElementById('caregiverHolidayDate').value = date;
            document.getElementById('caregiverHolidayDescription').value = description;
          }));

          tbody.querySelectorAll('button[data-date]').forEach(btn => btn.addEventListener('click', async () => {
            const date = btn.getAttribute('data-date');
            if (!confirm('ยืนยันลบวันหยุดพี่เลี้ยง ' + date + '?')) return;
            try { await api(`/api/admin/caregiver-holidays?date=${encodeURIComponent(date)}`, { method: 'DELETE' }); loadCaregiverHolidays(caregiverPage); } catch (err) { alert(err.message); }
          }));

          document.getElementById('caregiverPrevBtn').onclick = () => { if (caregiverPage > 1) loadCaregiverHolidays(caregiverPage - 1); };
          document.getElementById('caregiverNextBtn').onclick = () => { if (caregiverPage < totalPages) loadCaregiverHolidays(caregiverPage + 1); };
        } catch (err) { alert('โหลดไม่สำเร็จ: ' + err.message); }
      }

      document.getElementById('saveCaregiverHolidayBtn').addEventListener('click', async () => {
        const date = document.getElementById('caregiverHolidayDate').value;
        const description = document.getElementById('caregiverHolidayDescription').value.trim();
        if (!date || !description) return alert('กรุณาใส่วันที่และคำอธิบาย');
        try {
          await api('/api/admin/caregiver-holidays', { method: 'POST', body: JSON.stringify({ holiday_date: date, description }) });
          alert('บันทึกเรียบร้อย');
          loadCaregiverHolidays(caregiverPage);
        } catch (err) { alert(err.message); }
      });

      document.getElementById('loadCaregiverHolidaysBtn').addEventListener('click', () => loadCaregiverHolidays(1));

      // initial
      loadMemories();
      loadSchedule();
      loadCaregiverHolidays();
    </script>
  </body>
</html>
