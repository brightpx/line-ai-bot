<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard ตารางเวร</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-WZ/paXb5+X0Vv9qG8em7P6H/1v7Rd0G8m0NQ5Sj72D8O+3yP3o5G3Nj6fJ4F6BzK" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body { background: #f8f9fa; }
      .chart-card { min-height: 380px; }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3">Dashboard ตารางเวร</h1>
          <p class="text-muted mb-0">ดูสรุปเวรพร้อมกราฟและตารางข้อมูล</p>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">รายการทั้งหมด</h5>
              <p class="display-6 mb-0" id="totalCount">0</p>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card shadow-sm chart-card">
            <div class="card-body">
              <h5 class="card-title">สัดส่วนประเภทเวร</h5>
              <canvas id="shiftChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">ตารางเวร</h5>
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>วันที่</th>
                  <th>เวร</th>
                  <th>ประเภท</th>
                  <th>บันทึกเมื่อ</th>
                </tr>
              </thead>
              <tbody id="scheduleTableBody">
                <tr><td colspan="4" class="text-center py-4">กำลังโหลดข้อมูล...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      async function initDashboard() {
        const response = await fetch('/api/schedule');
        const data = await response.json();

        const counts = data.counts;
        document.getElementById('totalCount').textContent = data.items.length;

        const chartData = [counts.morning, counts.afternoon, counts.evening, counts.night, counts.off, counts.other];
        const chartLabels = ['เช้า', 'บ่าย', 'เย็น', 'กลางคืน', 'พัก/หยุด', 'อื่น ๆ'];

        const ctx = document.getElementById('shiftChart');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: chartLabels,
            datasets: [{
              data: chartData,
              backgroundColor: ['#0d6efd', '#ffc107', '#6610f2', '#0d6efd80', '#198754', '#6c757d'],
              borderColor: '#fff',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'bottom' },
              tooltip: { callbacks: { label: context => context.label + ': ' + context.parsed } }
            }
          }
        });

        const tbody = document.getElementById('scheduleTableBody');
        tbody.innerHTML = data.items.length === 0
          ? '<tr><td colspan="4" class="text-center py-4">ยังไม่มีตารางเวร</td></tr>'
          : data.items.map(item => `
              <tr>
                <td>${item.date}</td>
                <td>${item.shift}</td>
                <td>${item.categoryLabel}</td>
                <td>${item.createdAt}</td>
              </tr>
            `).join('');
      }

      initDashboard().catch(err => {
        document.getElementById('scheduleTableBody').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">ไม่สามารถโหลดข้อมูลได้</td></tr>`;
        console.error(err);
      });
    </script>
  </body>
</html>
